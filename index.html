<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工事担任者 過去問クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="top-bar">
    <button id="theme-toggle">🌙 ダークモード切替</button>
  </div>

  <h1>工事担任者 過去問クイズ</h1>

  <div id="quiz-container">
    <p id="loading-message">問題データを読み込み中...</p>
    <p id="loading-error" class="hidden">問題データの読み込みに失敗しました。再読み込みしてください。</p>

    <div id="menu-area" class="hidden">
      <div class="menu-section">
        <h2>1. 科目と試験回を選択</h2>
        <select id="subject-select">
          <option value="tech">技術及び理論</option>
          <option value="law">法規</option>
        </select>
        <select id="iteration-select">
          <option value="all">すべての試験回 (ランダム)</option>
        </select>
        <br>
        <button class="btn-primary" id="start-normal-btn">通常学習スタート</button>
      </div>

      <hr style="border: 0; border-top: 1px solid var(--btn-border); margin: 20px 0;">

      <div class="menu-section">
        <h2>2. 復習モード</h2>
        <p class="data-stats">保存されている間違えた問題: <span id="mistake-count">0</span>問</p>
        <button id="start-mistakes-btn">間違えた問題を復習</button>
        <button class="btn-danger" id="clear-mistakes-btn">履歴クリア</button>

        <p class="data-stats">ブックマークした問題: <span id="bookmark-count">0</span>問</p>
        <button id="start-bookmarks-btn">ブックマークを学習</button>
        <button class="btn-danger" id="clear-bookmarks-btn">履歴クリア</button>
      </div>
    </div>

    <div id="quiz-area" class="hidden">
      <div id="stats-bar">
        <span>第 <span id="current-q-num">1</span> 問 / 全 <span id="total-q-num">10</span> 問</span>
        <span>正解: <span id="correct-count">0</span> (<span id="accuracy-rate">0.0</span>%)</span>
      </div>
      <div id="progress-container">
        <div id="progress-bar"></div>
      </div>

      <div id="question-header">
        <p id="question-year"></p>
        <button id="bookmark-btn">★ ブックマーク</button>
      </div>
      <p id="question-text"></p>

      <div id="options-area"></div>

      <div id="controls">
        <button id="submit-btn" disabled>解答する</button>
        <button id="next-btn" class="hidden">次の問題へ</button>
      </div>
      <div id="feedback-area" class="hidden"></div>
    </div>

    <div id="result-area" class="hidden">
      <h2>結果発表</h2>
      <h3 id="score-text"></h3>
      <p id="result-detail"></p>
      <button class="btn-primary" id="return-menu-btn">メニューへ戻る</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
